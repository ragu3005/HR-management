services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: hrms-pro-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/organization
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: hrms-pro-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: hrms-pro-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hrms-pro-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # 2. Frontend Static Site
  - type: web
    name: hrms-pro-frontend
    env: static
    staticPublishPath: ./frontend
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # MySQL Database on Render
  - name: hrms-pro-db
    databaseName: hrms_db
    user: hrms_user
    plan: free
    region: oregon
