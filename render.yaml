services:
  # HRMS Pro Full-Stack Web Service (Spring Boot + Built-in UI)
  - type: web
    name: hrms-pro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
        # Example for Aiven / PlanetScale / Clever Cloud / Railway MySQL:
        # jdbc:mysql://<host>:<port>/<dbname>?useSSL=true&serverTimezone=UTC
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_UPLOAD_DIR
        value: /app/uploads
