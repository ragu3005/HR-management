# ============================================================
# HRMS Pro – Application Configuration
# ============================================================

spring.application.name=hrms-pro

# Server
server.port=${PORT:8080}
server.servlet.context-path=/

# ============================================================
# Database (override in prod via env vars: DB_URL, DB_USERNAME, DB_PASSWORD)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hrms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP - optimized for Cloud Free Tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000



# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true


# ============================================================
# JWT Configuration
# ============================================================
jwt.secret=${JWT_SECRET:hrmsProSuperSecretKeyForJWTTokenGenerationMustBe256BitsLongAtLeast2024}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# File Storage
# ============================================================
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
app.file.max-size-bytes=${FILE_MAX_SIZE:10485760}
app.file.allowed-types=pdf,jpg,jpeg,png

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=*

# ============================================================
# Multipart
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ============================================================
# Logging
# ============================================================
logging.level.com.hrms=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
