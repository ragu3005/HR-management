<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – HRMS Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      min-height: 100vh;
      padding: 30px 20px;
    }
    .register-container {
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: var(--radius);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      padding: 36px 40px;
      backdrop-filter: blur(10px);
    }
    .register-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .register-brand .brand-logo {
      margin: 0 auto 10px;
      width: 48px;
      height: 48px;
      font-size: 1.5rem;
    }
    .register-brand h2 {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .register-brand p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 3px;
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 520px) {
      .form-grid-2 {
        grid-template-columns: 1fr;
      }
      .register-container {
        padding: 24px 20px;
      }
    }
    .form-group {
      margin-bottom: 14px;
    }
    .password-wrapper {
      position: relative;
    }
    .toggle-pwd-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px;
      user-select: none;
    }
    .toggle-pwd-btn:hover {
      color: var(--primary);
    }
    .strength-meter {
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
      display: flex;
    }
    .strength-bar {
      height: 100%;
      width: 0%;
      transition: all 0.3s ease;
    }
    .strength-text {
      font-size: 0.72rem;
      margin-top: 3px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .role-selection-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 4px;
    }
    .role-card-opt {
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      background: var(--bg-main);
      transition: var(--transition);
    }
    .role-card-opt:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .role-card-opt.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }
    .role-card-opt .role-title {
      font-size: 0.8rem;
      display: block;
    }
    .role-card-opt .role-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
    }
    .terms-check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 16px 0 14px;
      cursor: pointer;
    }
    .terms-check input {
      margin-top: 3px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="register-brand">
      <div class="brand-logo">H</div>
      <h2>Create HRMS Pro Account</h2>
      <p>Self-Service Employee Onboarding Portal</p>
    </div>

    <form id="register-form">
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="firstName">First Name *</label>
          <input type="text" id="firstName" class="form-control" placeholder="John" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="lastName">Last Name *</label>
          <input type="text" id="lastName" class="form-control" placeholder="Doe" required>
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="email">Official Email *</label>
          <input type="email" id="email" class="form-control" placeholder="johndoe@hrms.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="+91 9876543210">
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="departmentId">Department</label>
          <select id="departmentId" class="form-control">
            <option value="">-- Select Department --</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="gender">Gender</label>
          <select id="gender" class="form-control">
            <option value="">-- Select Gender --</option>
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Portal Account Role</label>
        <div class="role-selection-cards" id="role-options-grid">
          <div class="role-card-opt selected" data-role="EMPLOYEE" onclick="selectRole('EMPLOYEE')">
            <span class="role-title">👤 Employee</span>
            <span class="role-sub">Standard access</span>
          </div>
          <div class="role-card-opt" data-role="MANAGER" onclick="selectRole('MANAGER')">
            <span class="role-title">👔 Manager</span>
            <span class="role-sub">Team & leave approvals</span>
          </div>
          <div class="role-card-opt" data-role="HR_ADMIN" onclick="selectRole('HR_ADMIN')">
            <span class="role-title">🛡️ HR Admin</span>
            <span class="role-sub">HR & management</span>
          </div>
        </div>
        <input type="hidden" id="selectedRole" value="EMPLOYEE">
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 chars) *</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
            <button type="button" class="toggle-pwd-btn" onclick="togglePassword('password', this)" title="Show/Hide">👁️</button>
          </div>
          <div class="strength-meter">
            <div class="strength-bar" id="strength-bar"></div>
          </div>
          <div class="strength-text" id="strength-text">Password strength</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password *</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
            <button type="button" class="toggle-pwd-btn" onclick="togglePassword('confirmPassword', this)" title="Show/Hide">👁️</button>
          </div>
          <div id="match-text" style="font-size:0.72rem; margin-top:3px; color:var(--text-muted);"></div>
        </div>
      </div>

      <label class="terms-check">
        <input type="checkbox" id="terms" required checked>
        <span>I agree to HRMS Pro workplace policies, confidentiality, and data terms.</span>
      </label>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:13px; font-weight:600;" id="register-btn">
        Register & Enter Portal
      </button>

      <div style="text-align: center; margin-top: 18px; font-size: 0.88rem; color: var(--text-muted);">
        Already have an account? <a href="index.html" style="font-weight: 600; color: var(--primary);">Sign In here</a>
      </div>
    </form>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    // Role selection handler
    function selectRole(role) {
      document.getElementById('selectedRole').value = role;
      document.querySelectorAll('.role-card-opt').forEach(el => {
        if (el.dataset.role === role) {
          el.classList.add('selected');
        } else {
          el.classList.remove('selected');
        }
      });
    }

    // Toggle Password Visibility
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = '🙈';
      } else {
        input.type = 'password';
        btn.innerText = '👁️';
      }
    }

    // Password strength evaluator
    const pwdInput = document.getElementById('password');
    const confirmPwdInput = document.getElementById('confirmPassword');
    const strengthBar = document.getElementById('strength-bar');
    const strengthText = document.getElementById('strength-text');
    const matchText = document.getElementById('match-text');

    pwdInput.addEventListener('input', () => {
      const val = pwdInput.value;
      let score = 0;
      if (val.length >= 6) score += 25;
      if (/[A-Z]/.test(val)) score += 25;
      if (/[0-9]/.test(val)) score += 25;
      if (/[^A-Za-z0-9]/.test(val)) score += 25;

      strengthBar.style.width = score + '%';
      if (score <= 25) {
        strengthBar.style.background = '#ef4444';
        strengthText.innerText = 'Weak (add numbers & symbols)';
        strengthText.style.color = '#ef4444';
      } else if (score <= 50) {
        strengthBar.style.background = '#f59e0b';
        strengthText.innerText = 'Fair (add uppercase & special chars)';
        strengthText.style.color = '#f59e0b';
      } else if (score <= 75) {
        strengthBar.style.background = '#3b82f6';
        strengthText.innerText = 'Good password';
        strengthText.style.color = '#3b82f6';
      } else {
        strengthBar.style.background = '#10b981';
        strengthText.innerText = 'Strong password ✓';
        strengthText.style.color = '#10b981';
      }

      checkMatch();
    });

    confirmPwdInput.addEventListener('input', checkMatch);

    function checkMatch() {
      if (!confirmPwdInput.value) {
        matchText.innerText = '';
        return;
      }
      if (pwdInput.value === confirmPwdInput.value) {
        matchText.innerText = '✓ Passwords match';
        matchText.style.color = '#10b981';
      } else {
        matchText.innerText = '✕ Passwords do not match';
        matchText.style.color = '#ef4444';
      }
    }

    // Load Department Options
    async function loadRegistrationMeta() {
      try {
        const data = await Auth.getRegistrationOptions();
        const deptSelect = document.getElementById('departmentId');
        if (data && data.departments && data.departments.length > 0) {
          deptSelect.innerHTML = '<option value="">-- Select Department --</option>' +
            data.departments.map(d => `<option value="${d.id}">${d.name} (${d.deptCode})</option>`).join('');
        } else {
          // Fallback static list if server not started yet
          deptSelect.innerHTML = `
            <option value="">-- Select Department --</option>
            <option value="1">Engineering (ENG)</option>
            <option value="2">Human Resources (HR)</option>
            <option value="3">Sales & Marketing (SALES)</option>
            <option value="4">Operations (OPS)</option>
            <option value="5">Finance & Accounting (FIN)</option>
          `;
        }
      } catch (e) {
        console.log('Using default department choices');
        const deptSelect = document.getElementById('departmentId');
        deptSelect.innerHTML = `
          <option value="">-- Select Department --</option>
          <option value="1">Engineering (ENG)</option>
          <option value="2">Human Resources (HR)</option>
          <option value="3">Sales & Marketing (SALES)</option>
          <option value="4">Operations (OPS)</option>
          <option value="5">Finance & Accounting (FIN)</option>
        `;
      }
    }

    loadRegistrationMeta();

    // Form submission
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const deptVal = document.getElementById('departmentId').value;
      const gender = document.getElementById('gender').value;
      const role = document.getElementById('selectedRole').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('register-btn');

      if (password !== confirmPassword) {
        Utils.showToast('Passwords do not match. Please re-enter.', 'error');
        return;
      }

      if (password.length < 6) {
        Utils.showToast('Password must be at least 6 characters.', 'error');
        return;
      }

      try {
        btn.disabled = true;
        btn.innerText = 'Creating account & setting up profile...';

        const payload = {
          firstName,
          lastName,
          email,
          phone,
          role,
          gender: gender || null,
          departmentId: deptVal ? parseInt(deptVal) : null,
          password
        };

        const result = await Auth.register(payload);
        Utils.showToast(`Welcome ${result.fullName || firstName}! Account created successfully. Redirecting...`, 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      } catch (err) {
        Utils.showToast(err.message || 'Registration failed. Please check your information.', 'error');
        btn.disabled = false;
        btn.innerText = 'Register & Enter Portal';
      }
    });
  </script>
</body>
</html>
