<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements – HRMS Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .announcement-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .ann-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="sidebar-mount"></div>

    <div class="main-wrapper">
      <div id="header-mount"></div>

      <main class="content-body">
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Company Announcements</h3>
              <p style="font-size:0.85rem; color:var(--text-muted); margin-top:2px;">Stay informed with the latest updates from management</p>
            </div>
            <button class="btn btn-primary" id="btn-create-ann" onclick="Utils.openModal('ann-modal')" style="display:none;">+ New Announcement</button>
          </div>

          <div id="announcements-container">
            <div style="color:var(--text-muted); text-align:center;">Loading announcements...</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create Announcement Modal -->
  <div class="modal-backdrop" id="ann-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Publish Announcement</h3>
        <button class="close-btn" onclick="Utils.closeModal('ann-modal')">&times;</button>
      </div>
      <form id="ann-form">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" id="ann-title" class="form-control" placeholder="Announcement title..." required>
        </div>

        <div class="form-group">
          <label class="form-label">Priority</label>
          <select id="ann-priority" class="form-control">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
            <option value="URGENT">Urgent</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Content *</label>
          <textarea id="ann-content" class="form-control" rows="4" placeholder="Announcement message..." required></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
          <button type="button" class="btn btn-outline" onclick="Utils.closeModal('ann-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Publish Now</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Utils.initLayout('announcements', 'Announcements');

    if (Auth.hasAnyRole('SUPER_ADMIN', 'HR_ADMIN')) {
      document.getElementById('btn-create-ann').style.display = 'inline-flex';
    }

    async function loadAnnouncements() {
      try {
        const res = await API.get('/announcements');
        const container = document.getElementById('announcements-container');
        if (res && res.data && res.data.length > 0) {
          container.innerHTML = res.data.map(a => `
            <div class="announcement-card">
              <div class="ann-header">
                <div style="display:flex; align-items:center; gap:10px;">
                  <span class="badge badge-primary">${a.priority}</span>
                  <span style="font-size:0.85rem; color:var(--text-muted);">${Utils.formatDate(a.publishedAt || a.createdAt)}</span>
                </div>
                ${Auth.hasAnyRole('SUPER_ADMIN', 'HR_ADMIN') ? `
                  <button class="btn btn-danger btn-sm" onclick="deleteAnnouncement(${a.id})">Delete</button>
                ` : ''}
              </div>
              <h3 style="font-size:1.15rem; font-weight:700; margin-bottom:8px;">${a.title}</h3>
              <p style="color:var(--text-main); font-size:0.92rem; line-height:1.6; white-space:pre-wrap;">${a.content}</p>
            </div>
          `).join('');
        } else {
          container.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding:32px 0;">No active announcements.</div>`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteAnnouncement(id) {
      if (!confirm('Are you sure you want to delete this announcement?')) return;
      try {
        await API.delete(`/announcements/${id}`);
        Utils.showToast('Announcement deleted');
        loadAnnouncements();
      } catch (err) {
        Utils.showToast(err.message || 'Delete failed', 'error');
      }
    }

    document.getElementById('ann-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        title: document.getElementById('ann-title').value.trim(),
        priority: document.getElementById('ann-priority').value,
        content: document.getElementById('ann-content').value.trim(),
        isPublished: true
      };

      try {
        await API.post('/announcements', data);
        Utils.showToast('Announcement published successfully!');
        Utils.closeModal('ann-modal');
        document.getElementById('ann-form').reset();
        loadAnnouncements();
      } catch (err) {
        Utils.showToast(err.message || 'Action failed', 'error');
      }
    });

    loadAnnouncements();
  </script>
</body>
</html>
