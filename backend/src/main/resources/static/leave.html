<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management – HRMS Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .leave-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .leave-tab {
      padding: 10px 18px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: var(--transition);
    }
    .leave-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .leave-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="sidebar-mount"></div>

    <div class="main-wrapper">
      <div id="header-mount"></div>

      <main class="content-body">
        <!-- Leave Balances -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">My Leave Balances (Current Year)</h3>
            <button class="btn btn-primary" onclick="openApplyLeaveModal()">+ Apply for Leave</button>
          </div>
          <div class="stat-grid" id="leave-balance-grid" style="margin-bottom:0;">
            <div style="color:var(--text-muted);">Loading balances...</div>
          </div>
        </div>

        <!-- Requests Tabs & Table -->
        <div class="card">
          <div class="leave-tabs">
            <button class="leave-tab active" onclick="switchLeaveTab('my')">My Leave Requests</button>
            <button class="leave-tab" id="tab-manager-btn" onclick="switchLeaveTab('team')" style="display:none;">Team Leave Requests</button>
            <button class="leave-tab" id="tab-hr-btn" onclick="switchLeaveTab('all')" style="display:none;">All Organization Requests</button>
          </div>

          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Employee</th>
                  <th>Leave Type</th>
                  <th>Date Range</th>
                  <th>Days</th>
                  <th>Status</th>
                  <th>Reason</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody id="leave-table-body">
                <tr><td colspan="7" style="text-align:center;">Loading leave requests...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Apply Leave Modal -->
  <div class="modal-backdrop" id="apply-leave-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Apply for Leave</h3>
        <button class="close-btn" onclick="Utils.closeModal('apply-leave-modal')">&times;</button>
      </div>
      <form id="apply-leave-form">
        <div class="form-group">
          <label class="form-label">Leave Type *</label>
          <select id="apply-leave-type" class="form-control" required>
            <option value="1">Casual Leave (CL)</option>
            <option value="2">Sick Leave (SL)</option>
            <option value="3">Paid Leave (PL)</option>
            <option value="4">Unpaid Leave (UL)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Start Date *</label>
            <input type="date" id="apply-start-date" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">End Date *</label>
            <input type="date" id="apply-end-date" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label style="display:flex; align-items:center; gap:8px; font-weight:600; font-size:0.875rem; cursor:pointer;">
            <input type="checkbox" id="apply-half-day" onchange="toggleHalfDay(this.checked)"> Apply for Half Day
          </label>
        </div>

        <div class="form-group" id="half-day-options" style="display:none;">
          <label class="form-label">Half Day Slot</label>
          <select id="apply-half-day-slot" class="form-control">
            <option value="MORNING">Morning Session</option>
            <option value="AFTERNOON">Afternoon Session</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Reason *</label>
          <textarea id="apply-reason" class="form-control" rows="3" placeholder="State the reason for leave..." required></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
          <button type="button" class="btn btn-outline" onclick="Utils.closeModal('apply-leave-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="apply-submit-btn">Submit Request</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Utils.initLayout('leave', 'Leave Management');

    let currentTab = 'my';

    function initRoleTabs() {
      if (Auth.hasAnyRole('SUPER_ADMIN', 'HR_ADMIN')) {
        document.getElementById('tab-hr-btn').style.display = 'block';
        document.getElementById('tab-manager-btn').style.display = 'block';
      } else if (Auth.hasRole('MANAGER')) {
        document.getElementById('tab-manager-btn').style.display = 'block';
      }
    }

    async function loadBalances() {
      try {
        const res = await API.get('/leaves/balances');
        const container = document.getElementById('leave-balance-grid');
        if (res && res.data && res.data.length > 0) {
          container.innerHTML = res.data.map(b => `
            <div class="stat-card">
              <div class="stat-icon icon-emerald">🌿</div>
              <div class="stat-details">
                <span class="stat-value">${b.remainingDays}</span>
                <span class="stat-label">${b.leaveTypeName} (Total ${b.totalDays})</span>
                <span style="font-size:0.75rem; color:var(--text-muted);">Used: ${b.usedDays} | Pending: ${b.pendingDays}</span>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadLeaves() {
      try {
        let endpoint = '/leaves/my';
        if (currentTab === 'all' || currentTab === 'team') {
          endpoint = '/leaves';
        }

        const res = await API.get(endpoint);
        const tbody = document.getElementById('leave-table-body');
        const list = res.data?.content || res.data || [];

        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">No leave requests found.</td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(l => `
          <tr>
            <td>
              <strong>${l.employeeName}</strong>
              <div style="font-size:0.75rem; color:var(--text-muted);">${l.employeeCode}</div>
            </td>
            <td>${l.leaveTypeName}</td>
            <td>${Utils.formatDate(l.startDate)} - ${Utils.formatDate(l.endDate)}</td>
            <td>${l.totalDays} Days</td>
            <td>${Utils.getStatusBadge(l.status)}</td>
            <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${l.reason}</td>
            <td style="text-align:right;">
              ${renderActions(l)}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    function renderActions(l) {
      if (currentTab === 'my' && l.status === 'PENDING') {
        return `<button class="btn btn-danger btn-sm" onclick="cancelLeave(${l.id})">Cancel</button>`;
      }

      if (currentTab === 'team' && l.status === 'PENDING') {
        return `
          <button class="btn btn-success btn-sm" onclick="managerAction(${l.id}, true)">Approve</button>
          <button class="btn btn-danger btn-sm" onclick="managerAction(${l.id}, false)">Reject</button>
        `;
      }

      if (currentTab === 'all' && (l.status === 'PENDING' || l.status === 'MANAGER_APPROVED')) {
        return `
          <button class="btn btn-success btn-sm" onclick="hrAction(${l.id}, true)">HR Approve</button>
          <button class="btn btn-danger btn-sm" onclick="hrAction(${l.id}, false)">HR Reject</button>
        `;
      }

      return '-';
    }

    function switchLeaveTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.leave-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      loadLeaves();
    }

    function toggleHalfDay(checked) {
      document.getElementById('half-day-options').style.display = checked ? 'block' : 'none';
      if (checked) {
        document.getElementById('apply-end-date').value = document.getElementById('apply-start-date').value;
      }
    }

    function openApplyLeaveModal() {
      document.getElementById('apply-leave-form').reset();
      document.getElementById('apply-start-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('apply-end-date').value = new Date().toISOString().split('T')[0];
      Utils.openModal('apply-leave-modal');
    }

    document.getElementById('apply-leave-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const isHalf = document.getElementById('apply-half-day').checked;
      const data = {
        leaveTypeId: document.getElementById('apply-leave-type').value,
        startDate: document.getElementById('apply-start-date').value,
        endDate: isHalf ? document.getElementById('apply-start-date').value : document.getElementById('apply-end-date').value,
        isHalfDay: isHalf,
        halfDayType: isHalf ? document.getElementById('apply-half-day-slot').value : null,
        reason: document.getElementById('apply-reason').value.trim()
      };

      try {
        await API.post('/leaves/apply', data);
        Utils.showToast('Leave applied successfully!', 'success');
        Utils.closeModal('apply-leave-modal');
        loadBalances();
        loadLeaves();
      } catch (err) {
        Utils.showToast(err.message || 'Failed to apply leave', 'error');
      }
    });

    async function cancelLeave(id) {
      if (!confirm('Are you sure you want to cancel this leave?')) return;
      try {
        await API.delete(`/leaves/${id}/cancel`);
        Utils.showToast('Leave request cancelled');
        loadBalances();
        loadLeaves();
      } catch (err) {
        Utils.showToast(err.message || 'Action failed', 'error');
      }
    }

    async function managerAction(id, approve) {
      try {
        await API.put(`/leaves/${id}/manager-action?approve=${approve}`, { comment: approve ? 'Approved by Manager' : 'Rejected' });
        Utils.showToast(`Request ${approve ? 'approved' : 'rejected'}`);
        loadLeaves();
      } catch (err) {
        Utils.showToast(err.message || 'Action failed', 'error');
      }
    }

    async function hrAction(id, approve) {
      try {
        await API.put(`/leaves/${id}/hr-action?approve=${approve}`, { comment: approve ? 'Approved by HR' : 'Rejected' });
        Utils.showToast(`Request ${approve ? 'approved' : 'rejected'}`);
        loadLeaves();
      } catch (err) {
        Utils.showToast(err.message || 'Action failed', 'error');
      }
    }

    async function loadLeaveTypes() {
      try {
        const res = await API.get('/leaves/types');
        if (res && res.data && res.data.length > 0) {
          const select = document.getElementById('apply-leave-type');
          if (select) {
            select.innerHTML = res.data.map(t => `<option value="${t.id}">${t.name} (${t.code})</option>`).join('');
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    initRoleTabs();
    loadLeaveTypes();
    loadBalances();
    loadLeaves();
  </script>
</body>
</html>
