name: HRMS Pro CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        cd backend
        mvn -B clean package -DskipTests

    - name: Verify Frontend Asset Integrity
      run: |
        test -f frontend/index.html
        test -f frontend/dashboard.html
        test -f frontend/employees.html
        test -f frontend/css/main.css
        test -f frontend/js/api.js
