<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – HRMS Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: var(--radius);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      padding: 40px;
      backdrop-filter: blur(8px);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand .brand-logo {
      margin: 0 auto 12px;
      width: 48px;
      height: 48px;
      font-size: 1.5rem;
    }
    .login-brand h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .login-brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .quick-roles {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    .quick-roles-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-align: center;
    }
    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .role-pill {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: var(--transition);
    }
    .role-pill:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-brand">
      <div class="brand-logo">H</div>
      <h2>HRMS Pro</h2>
      <p>Human Resource Management System</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Official Email</label>
        <input type="email" id="email" class="form-control" placeholder="name@hrms.com" required value="admin@hrms.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required value="Admin@123">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px; padding:12px;" id="login-btn">
        Sign In to Portal
      </button>
    </form>

    <div class="quick-roles">
      <div class="quick-roles-title">Demo Quick Login</div>
      <div class="role-grid">
        <div class="role-pill" onclick="quickFill('admin@hrms.com', 'Admin@123')">⚡ Super Admin</div>
        <div class="role-pill" onclick="quickFill('hr@hrms.com', 'Admin@123')">⚡ HR Admin</div>
        <div class="role-pill" onclick="quickFill('manager@hrms.com', 'Admin@123')">⚡ Manager</div>
        <div class="role-pill" onclick="quickFill('employee@hrms.com', 'Admin@123')">⚡ Employee</div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    function quickFill(email, pwd) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pwd;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');

      try {
        btn.disabled = true;
        btn.innerText = 'Authenticating...';
        await Auth.login(email, password);
        Utils.showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 600);
      } catch (err) {
        Utils.showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.innerText = 'Sign In to Portal';
      }
    });
  </script>
</body>
</html>
