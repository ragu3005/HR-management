<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents – HRMS Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebar-mount"></div>

    <div class="main-wrapper">
      <div id="header-mount"></div>

      <main class="content-body">
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Employee Document Center</h3>
              <p style="font-size:0.85rem; color:var(--text-muted); margin-top:2px;">Upload, preview, and securely store your official documents</p>
            </div>
            <button class="btn btn-primary" onclick="Utils.openModal('upload-modal')">+ Upload Document</button>
          </div>

          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Document Name</th>
                  <th>Category</th>
                  <th>Type</th>
                  <th>Size</th>
                  <th>Uploaded Date</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody id="docs-table-body">
                <tr><td colspan="6" style="text-align:center;">Loading documents...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal-backdrop" id="upload-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Upload New Document</h3>
        <button class="close-btn" onclick="Utils.closeModal('upload-modal')">&times;</button>
      </div>
      <form id="doc-upload-form">
        <div class="form-group">
          <label class="form-label">Document Name *</label>
          <input type="text" id="doc-name-input" class="form-control" placeholder="e.g. Identity Proof / Passport" required>
        </div>

        <div class="form-group">
          <label class="form-label">Category *</label>
          <select id="doc-cat-input" class="form-control" required>
            <option value="RESUME">Resume</option>
            <option value="OFFER_LETTER">Offer Letter</option>
            <option value="APPOINTMENT_LETTER">Appointment Letter</option>
            <option value="EDUCATIONAL_CERTIFICATE">Educational Certificate</option>
            <option value="EXPERIENCE_CERTIFICATE">Experience Certificate</option>
            <option value="IDENTITY_DOCUMENT">Identity Document</option>
            <option value="SALARY_DOCUMENT">Salary Document</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Select File (PDF, JPG, PNG - Max 10MB) *</label>
          <input type="file" id="doc-file-input" class="form-control" accept=".pdf,.jpg,.jpeg,.png" required>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
          <button type="button" class="btn btn-outline" onclick="Utils.closeModal('upload-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="upload-btn">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    Utils.initLayout('documents', 'Document Management');

    let currentEmpId = null;

    async function initUserAndDocs() {
      try {
        const user = API.getCurrentUser();
        const res = await API.get('/employees/me');
        if (res && res.data) {
          currentEmpId = res.data.id;
          loadDocs(currentEmpId);
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadDocs(empId) {
      try {
        const res = await API.get(`/documents/employee/${empId}`);
        const tbody = document.getElementById('docs-table-body');
        if (res && res.data && res.data.length > 0) {
          tbody.innerHTML = res.data.map(d => `
            <tr>
              <td><strong>${d.documentName}</strong></td>
              <td><span class="badge badge-primary">${d.documentCategory.replace('_', ' ')}</span></td>
              <td>${d.fileType.toUpperCase()}</td>
              <td>${d.fileSizeFormatted}</td>
              <td>${Utils.formatDate(d.uploadedAt)}</td>
              <td style="text-align:right;">
                <a href="${API_BASE_URL}/documents/${d.id}/view" target="_blank" class="btn btn-outline btn-sm">Preview</a>
                <a href="${API_BASE_URL}/documents/${d.id}/download" class="btn btn-outline btn-sm">Download</a>
                <button onclick="deleteDoc(${d.id})" class="btn btn-danger btn-sm">Delete</button>
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No documents found. Click + Upload Document to add one.</td></tr>`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteDoc(id) {
      if (!confirm('Are you sure you want to delete this document?')) return;
      try {
        await API.delete(`/documents/${id}`);
        Utils.showToast('Document deleted');
        loadDocs(currentEmpId);
      } catch (err) {
        Utils.showToast(err.message || 'Delete failed', 'error');
      }
    }

    document.getElementById('doc-upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentEmpId) return;

      const formData = new FormData();
      formData.append('name', document.getElementById('doc-name-input').value.trim());
      formData.append('category', document.getElementById('doc-cat-input').value);
      formData.append('file', document.getElementById('doc-file-input').files[0]);

      try {
        const btn = document.getElementById('upload-btn');
        btn.disabled = true;
        btn.innerText = 'Uploading...';
        await API.post(`/documents/upload/${currentEmpId}`, formData);
        Utils.showToast('Document uploaded successfully!', 'success');
        Utils.closeModal('upload-modal');
        document.getElementById('doc-upload-form').reset();
        btn.disabled = false;
        btn.innerText = 'Upload';
        loadDocs(currentEmpId);
      } catch (err) {
        Utils.showToast(err.message || 'Upload failed', 'error');
        document.getElementById('upload-btn').disabled = false;
      }
    });

    initUserAndDocs();
  </script>
</body>
</html>
